name: Update appsettings.json

on:
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install jq
      run: sudo apt-get install -y jq

    - name: Extract connection string from SIT file
      id: extract_connection_string
      run: |
        SIT_VALUE=$(jq -r '.ConnectionStrings["Eap.Reporting.ConnectionString"].connectionString' appsettings.Sit.json)
        echo "SIT_VALUE=$SIT_VALUE" >> $GITHUB_ENV

    - name: Replace value in appsettings.json
      run: |
        jq --arg connString "$SIT_VALUE" \
        '.ConnectionStrings["Eap.Reporting.ConnectionString"].connectionString = $connString' \
        appsettings.json > temp.json && mv temp.json appsettings.json

    - name: Upload modified appsettings.json
      uses: actions/upload-artifact@v4
      with:
        name: updated-appsettings
        path: appsettings.json
